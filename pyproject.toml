[project]
name = "ragwithvectorandsqldatabases"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Samuel Lee", email = "137744681+SamuelWLee27@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bs4>=0.0.2",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-weaviate>=0.0.8",
    "langgraph>=1.2.16",
    "lxml>=6.1.3",
    "pymupdf>=2.0",
    "simsimd>=6.5.16",
    "weaviate-client>=4.24.0",
]

[project.scripts]
ragwithvectorandsqldatabases = "ragwithvectorandsqldatabases:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = ["src", "scripts", "config"]
