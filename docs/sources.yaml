# Documents to load into Weaviate. The files themselves are copyrighted by their
# manufacturers and are not committed; run scripts/download_docs.py to fetch them.
#
# Fields:
#   id        unique, used as the file name in docs/raw/
#   product   must match products.name in the SQL database exactly
#   brand     manufacturer
#   doc_type  owners_manual / dealer_manual / spec_sheet / warranty / guide
#   url       direct link to the official file (PDF or HTML page)

- id: shimano-deore-rear-derailleur-dm
  product: "Shimano Deore RD-M6100"
  brand: Shimano
  doc_type: dealer_manual
  url: https://si.shimano.com/en/pdfs/dm/MARD001/DM-MARD001-04-ENG.pdf

- id: shimano-cues-rear-derailleur-dm
