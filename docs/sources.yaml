  doc_type: dealer_manual
  url: https://si.shimano.com/en/pdfs/dm/LARD002/DM-LARD002-05-ENG.pdf

- id: shimano-cues-shifter-dm
  product: "Shimano CUES SL-U6000"
  brand: Shimano
  doc_type: dealer_manual
  url: https://si.shimano.com/en/pdfs/dm/LASL001/DM-LASL001-03-ENG.pdf

- id: trek-torque-guide
  product: null            # general doc, not tied to one product
  brand: Trek
